name: Sprout morning cron

# Runs hourly and calls /api/cron/morning — the route itself decides whether
# it's actually the user's morning (DST-proof, with a short catch-up window for
# late runs — see L27). Exists on GitHub Actions instead of Vercel Cron because
# Vercel Hobby limits cron to once/day at a fixed UTC time.
#
# GOTCHAS:
# - Minute 17, not :00. Top-of-hour is GitHub's busiest slot, where scheduled
#   runs are most often delayed or dropped.
# - GitHub auto-disables scheduled workflows after 60 days with no repo
#   activity. If reminders stop, check the Actions tab and re-enable.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/morning
        # Secrets go through env, not inline ${{ }} in the script, so their
        # values are never spliced into shell source.
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL and/or CRON_SECRET repo secrets are not set (repo Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if ! http_code=$(curl -sS --max-time 30 -o /tmp/cron-response.json -w "%{http_code}" -X POST \
            "$APP_URL/api/cron/morning" \
            -H "Authorization: Bearer $CRON_SECRET"); then
            echo "::error::curl failed to reach the app (timeout or connection error)."
            exit 1
          fi
          echo "HTTP $http_code"
          cat /tmp/cron-response.json
          echo
          if [ "$http_code" -ge 400 ]; then
            echo "::error::/api/cron/morning returned HTTP $http_code — see response body above."
            exit 1
          fi
